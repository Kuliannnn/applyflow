name: Contract and API checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: applyflow_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: applyflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applyflow_test -d applyflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GIN_MODE: release
      TEST_DATABASE_URL: postgres://applyflow_test:test-only-password@localhost:5432/applyflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.lock
            scripts/export-requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: make setup-tools
      - run: make check
      - run: .venv/bin/python scripts/generate_frontend_types.py --check
      - run: make test-integration
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
