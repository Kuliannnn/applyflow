              description: Configuration version. Historical on a completed idempotent replay; GET returns
                current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfig'
      description: '1 KiB body. May incur provider charges. Sends no JD or resume. OpenAI Responses probe:
        maximum 8 seconds, 32 output tokens, 64 KiB response, no redirects or automatic retry. One in-flight
        test per owner, 3 accepted tests per rolling minute and 20 per rolling day. Durable idempotency
        is checked before version CAS: completed replay returns the original safe snapshot (possibly historical),
        running replay returns 202; GET polls current state. Crash deadline is 12 seconds and becomes inconclusive
        on access. Replacement/deletion fences late results. Provider failures return 200 with safe test_status/error_code,
        never raw bodies or 401. Receipts are retained for at least 24 hours; current implementation retains
        them indefinitely.'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Stable UUID for this logical connection test. Replays do not call the provider again;
          different body with the same key is a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigTest'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: applyflow_session
      description: Short-lived signed JWT; HttpOnly, Secure on HTTPS, SameSite=Lax, Path=/.
  schemas:
    ApplicationStatus:
      type: string
      enum:
      - saved
      - applied
      - hr_interview
      - technical_interview
      - final_interview
      - offer
      - rejected
      - withdrawn
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        request_id:
          type: string
        current_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              code:
                type: string
            required:
            - field
            - code
      required:
      - type
      - title
      - status
      - code
      - request_id
      example:
        type: urn:applyflow:problem:version-conflict
        title: Resource changed
        status: 409
        code: version_conflict
        request_id: example-request
        current_version: 2
    Credentials:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          minLength: 3
        password:
          type: string
          maxLength: 72
          minLength: 12
          writeOnly: true
          description: 12+ Unicode characters, at most 72 UTF-8 bytes for bcrypt; reject, never truncate.
            Do not trim/normalize passwords.
      required:
      - email
      - password
      example:
        email: alex@example.com
        password: example-password-123
    LoginCredentials:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          minLength: 3
        password:
          type: string
          maxLength: 72
          minLength: 1
          writeOnly: true
          description: At most 72 UTF-8 bytes; do not trim or normalize.
      required:
      - email
      - password
    Identity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 254
          format: email
          minLength: 3
        profile_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        created_at:
