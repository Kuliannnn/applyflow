openapi: 3.1.0
info:
  title: ApplyFlow API — Foundation and Application Studio
  version: 0.6.0
  description: Contract-first foundation and Studio data lifecycle. 40 operations are implemented, including personal AI settings and fixed-revision PDF/DOCX export;
    check x-implementation on each operation for availability. All mutations enforce CSRF + Origin; private responses
    use no-store. Default JSON limit 128 KiB; resume fact confirmation and document content writes 256
    KiB. Multipart file limit 10 MiB (proxy permits framing overhead). Text also has UTF-8 byte and semantic
    limits. Generation/refinement supports explicit mock execution only in this slice; real AI generation,
    billing, full profiles, interviews and analytics remain deferred. SSRF, file validation and lifecycle
    transactions are required before implementing routes.
servers:
- url: /
  description: Same-origin frontend and API
security:
- sessionCookie: []
tags:
- name: Authentication
  description: Session and CSRF lifecycle
- name: Profile
  description: Private basic profile
- name: Skills
  description: Catalogue and manual assessments
- name: Applications
  description: Owned job records and history
- name: Files
- name: Workspaces
- name: Resumes
- name: Documents
- name: Tasks
- name: AI settings
  description: Encrypted personal credentials and bounded connection tests
paths:
  /api/auth/csrf:
    get:
      operationId: getCSRFToken
      x-implementation: implemented
      tags:
      - Authentication
      summary: Get signed CSRF context
      description: Available before login. Sets an anonymous CSRF context cookie, or binds to the current
        session. Never caches. This endpoint does not issue an authentication session.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              description: Signed CSRF context cookie, Secure on HTTPS; Path=/; SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /api/auth/register:
    post:
      operationId: register
      x-implementation: implemented
      tags:
      - Authentication
      summary: Create account and session
      description: Normalize email with trim+lowercase; validate full email in the handler. In one transaction
        create user and empty profile (version 1). Sets authentication cookie; no email verification/reset
        workflow in this slice.
      responses:
        '201':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              description: Sets/clears applyflow_session HttpOnly; Secure in HTTPS; SameSite=Lax; Path=/.
                Auth tokens never appear in JSON. Login/register rotate the CSRF context; fetch /api/auth/csrf
                again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      x-max-body-bytes: 131072
  /api/auth/login:
    post:
      operationId: login
      x-implementation: implemented
      tags:
      - Authentication
      summary: Log in
      description: Log in
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              description: Sets/clears applyflow_session HttpOnly; Secure in HTTPS; SameSite=Lax; Path=/.
                Auth tokens never appear in JSON. Login/register rotate the CSRF context; fetch /api/auth/csrf
                again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      x-max-body-bytes: 131072
  /api/auth/logout:
    post:
      operationId: logout
      x-implementation: implemented
      tags:
      - Authentication
      summary: Clear session cookie
      description: Idempotently clears the cookie, including if the JWT expired. Validate signed CSRF
        context and Origin. Does not revoke a copied stateless JWT; no refresh tokens in this slice.
      responses:
        '204':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              description: Sets/clears applyflow_session HttpOnly; Secure in HTTPS; SameSite=Lax; Path=/.
                Auth tokens never appear in JSON. Login/register rotate the CSRF context; fetch /api/auth/csrf
                again.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
  /api/auth/me:
    get:
      operationId: getCurrentSession
      x-implementation: implemented
      tags:
      - Authentication
      summary: Get current identity and expiry
      description: Get current identity and expiry
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/me/profile:
    get:
      operationId: getProfile
      x-implementation: contract-only
      tags:
      - Profile
      summary: Get private basic profile
      description: Returns all nullable fields plus profile_version, even when no fields were filled.
        Preferences, education and experience endpoints are deferred.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateProfile
      x-implementation: contract-only
      tags:
      - Profile
      summary: Update basic profile
      description: Lock users, compare expected_version, upsert basics, increment profile_version exactly
        once and commit. Omitted fields unchanged; null clears a field. Empty strings are invalid. Do
        not change login email. Blank-only strings are invalid.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      x-max-body-bytes: 131072
  /api/skills:
    get:
      operationId: searchSkills
      x-implementation: contract-only
      tags:
      - Skills
      summary: Search canonical skills and aliases
      description: Trim and case-fold query; literal substring match on alias (escape SQL wildcard characters).
        Deduplicate by skill ID; sort by slug,id. Return limit results and has_more. Empty query browses
        catalogue. Unknown names return empty items; users cannot create global skills. Canonical spellings
        are aliases too.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          default: ''
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /api/me/skills:
    get:
      operationId: listMySkills
      x-implementation: contract-only
      tags:
      - Skills
      summary: List self-assessed skills
      description: Consistent snapshot of items and profile_version, sorted by skill slug. An absent skill
        is not_assessed, not new.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSkillList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/me/skills/{skill_id}:
    put:
      operationId: setMySkill
      x-implementation: contract-only
      tags:
      - Skills
      summary: Set skill self-assessment
      description: Lock users and compare expected_version. Upsert one catalogue skill; missing notes
        becomes empty. Increment profile_version once. Return 404 for unknown skill ID.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSkillResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSkillWrite'
      x-max-body-bytes: 131072
    delete:
      operationId: removeMySkill
      x-implementation: contract-only
      tags:
      - Skills
      summary: Remove a self-assessment
      description: If-Match carries the same profile_version as other profile writes. Compare before deleting.
        If matching and the assessment is absent, return current version unchanged (known catalogue skill
        required); successful removal increments once. 409 for stale version, 400 for missing/malformed
        header.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: skill_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"profile-[1-9][0-9]*"$
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
  /api/applications:
    post:
      operationId: createApplication
      x-implementation: contract-only
      tags:
      - Applications
      summary: Save a job
      description: 'Owner comes only from session. Defaults: status=saved, JD/notes empty, optional fields
        null, versions=1. Whitespace-only company/role rejected. Initial history row is recorded transactionally.
        Empty JD allowed. No idempotency guarantee for this operation; do not automatically retry uncertain
        POSTs.'
      responses:
        '201':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              schema:
                type: string
              description: /api/applications/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      x-max-body-bytes: 131072
    get:
      operationId: listApplications
      x-implementation: contract-only
      tags:
      - Applications
      summary: List own applications
      description: Filter only own records; archived=false means active only, true means archived only.
        query is literal case-insensitive substring of company/role. Order updated_at DESC,id DESC. Opaque
        versioned cursor contains boundary and normalized filter fingerprint; reject mismatches. Always
        apply owner separately; cursor never authorizes. Mutable list may shift; client deduplicates by
        ID.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      - name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
  /api/applications/{id}:
    get:
      operationId: getApplication
      x-implementation: contract-only
      tags:
      - Applications
      summary: Get own job details
      description: Own archived applications remain readable. Other owners return 404.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateApplication
      x-implementation: contract-only
      tags:
      - Applications
      summary: Edit own active job
      description: Owner + expected_version CAS; archived rows reject with 409 application_archived. Omitted
        fields unchanged; null only clears nullable fields. Database trigger increments version on every
        accepted update, jd_version only when JD changes, and records status transitions. Status may move
        in either direction to correct data; no inferred date_applied/first_response_at.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
      x-max-body-bytes: 131072
  /api/applications/{id}/archive:
    post:
      operationId: archiveApplication
      x-implementation: contract-only
      tags:
      - Applications
      summary: Archive own job
      description: Check owner and expected_version first. Set archived_at, database increments version.
        Already archived with matching version returns unchanged row; stale version returns 409. Archive
        does not change application status or delete history. Future analysis module must atomically cancel
        active work here before that module is enabled.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 16
        description: Signed CSRF token from GET /api/auth/csrf; also enforce same-origin Origin policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      x-max-body-bytes: 131072
  /api/applications/{id}/status-history:
    get:
      operationId: listApplicationHistory
