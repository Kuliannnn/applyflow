      - stage
      - state_version
      - attempts
      - cancel_requested
      - result
      - error_code
      - created_at
      - finished_at
      description: Safe view only; excludes input snapshots, lease/fence, credentials and private storage
        keys. Stage and result must agree with kind/status; completed has matching non-null result.
      allOf:
      - if:
          properties:
            status:
              const: completed
          required:
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/TaskResult'
            cancel_requested:
              const: false
        else:
          properties:
            result:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - completed
              - failed
              - cancelled
          required:
          - status
        then:
          properties:
            finished_at:
              type: string
              format: date-time
        else:
          properties:
            finished_at:
              type: 'null'
      - if:
          properties:
            status:
              const: queued
          required:
          - status
        then:
          properties:
            stage:
              const: queued
      - if:
          properties:
            status:
              const: retry_wait
          required:
          - status
        then:
          properties:
            stage:
              const: retry_wait
      - if:
          properties:
            status:
              const: completed
          required:
          - status
        then:
          properties:
            stage:
              const: completed
      - if:
          properties:
            status:
              const: failed
          required:
          - status
        then:
          properties:
            stage:
              const: failed
      - if:
          properties:
            status:
              const: cancelled
          required:
          - status
        then:
          properties:
            stage:
              const: cancelled
      - if:
          properties:
            kind:
              enum:
              - extract_jd
            status:
              const: completed
          required:
          - kind
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/ExtractedJob'
      - if:
          properties:
            kind:
              enum:
              - parse_resume
            status:
              const: completed
          required:
          - kind
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/ExtractedResume'
      - if:
          properties:
            kind:
              enum:
              - tailor_resume
              - write_cover_letter
              - revise_document
            status:
              const: completed
          required:
          - kind
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/DocumentTaskResult'
      - if:
          properties:
            kind:
              enum:
              - export_document
            status:
              const: completed
          required:
          - kind
          - status
        then:
          properties:
            result:
              $ref: '#/components/schemas/ExportTaskResult'
    Generation:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        workspace_id: *id001
        job_revision_id: *id001
        resume_revision_id: *id001
        profile_version: *id002
        execution_mode:
          type: string
          const: mock
        locale:
          type: string
          const: en
        resume_task:
          $ref: '#/components/schemas/TaskSnapshot'
        cover_letter_task:
          $ref: '#/components/schemas/TaskSnapshot'
        created_at: *id003
      required:
      - id
      - workspace_id
      - job_revision_id
      - resume_revision_id
      - profile_version
      - execution_mode
      - locale
      - resume_task
      - cover_letter_task
      - created_at
    GenerationRetry:
      type: object
      additionalProperties: false
      properties:
        expected_version: *id002
        kind:
          $ref: '#/components/schemas/DocumentKind'
      required:
      - expected_version
      - kind
      description: Retry only failed/cancelled kind from the current run, with the same immutable inputs.
        A succeeded document is never regenerated by retry.
    TaskAccepted:
      type: object
      additionalProperties: false
      properties:
        task_id: *id001
      required:
      - task_id
    EvidenceText:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: .*\S.*
        fact_ids:
          type: array
          items: *id001
          minItems: 0
          maxItems: 200
          uniqueItems: true
      required:
      - text
      - fact_ids
      description: AI factual claims require supporting IDs from this run. User edits may add claims but
        must be marked manual; missing IDs are never evidence of truth.
    ResumeSection:
      type: object
      additionalProperties: false
      properties:
        heading:
          type: string
          minLength: 1
          maxLength: 120
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceText'
          minItems: 1
          maxItems: 50
      required:
      - heading
      - items
    ResumeContent:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: resume
        title:
          type: string
          minLength: 1
          maxLength: 200
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ResumeSection'
          minItems: 1
          maxItems: 20
      required:
      - kind
      - title
      - sections
    CoverLetterContent:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: cover_letter
        salutation:
          type: string
          minLength: 1
          maxLength: 200
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceText'
          minItems: 1
          maxItems: 12
        closing:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - kind
      - salutation
      - paragraphs
      - closing
    DocumentContent:
      oneOf:
      - $ref: '#/components/schemas/ResumeContent'
      - $ref: '#/components/schemas/CoverLetterContent'
    Document:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        workspace_id: *id001
        kind:
          $ref: '#/components/schemas/DocumentKind'
        current_revision_id:
          anyOf:
          - *id001
          - type: 'null'
        version: *id002
        created_at: *id003
        updated_at: *id003
      required:
      - id
      - workspace_id
      - kind
      - current_revision_id
      - version
      - created_at
      - updated_at
    DocumentRevision:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        document_id: *id001
        kind:
          $ref: '#/components/schemas/DocumentKind'
        parent_revision_id:
          anyOf:
          - *id001
          - type: 'null'
        run_id: *id001
        task_id:
          anyOf:
          - *id001
          - type: 'null'
        origin:
          type: string
          enum:
          - ai
          - manual
        schema_version:
          type: integer
          const: 1
        content:
          $ref: '#/components/schemas/DocumentContent'
        change_summary:
          type: string
          minLength: 0
          maxLength: 2000
        created_at: *id003
      required:
      - id
      - document_id
      - kind
      - parent_revision_id
      - run_id
      - task_id
      - origin
      - schema_version
      - content
      - change_summary
      - created_at
    DocumentList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          minItems: 0
          maxItems: 2
      required:
      - items
    DocumentRevisionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRevision'
          minItems: 0
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 2048
          - type: 'null'
      required:
      - items
      - next_cursor
    DocumentSave:
      type: object
      additionalProperties: false
      properties:
        expected_version: *id002
        base_revision_id: *id001
        content:
          $ref: '#/components/schemas/DocumentContent'
      required:
      - expected_version
      - base_revision_id
      - content
      description: Save manual edit as new revision and CAS head in one transaction. Base must equal current
        head, or an owned candidate when head is empty. Reject content kind mismatch; do not accept raw
        HTML.
      example:
        expected_version: 1
        base_revision_id: 10000000-0000-4000-8000-000000000001
        content:
          kind: resume
          title: Backend Engineer
          sections:
          - heading: Experience
            items:
            - text: Built Go APIs.
              fact_ids:
              - 10000000-0000-4000-8000-000000000001
    DocumentSaved:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/Document'
        revision:
          $ref: '#/components/schemas/DocumentRevision'
      required:
      - document
      - revision
    RefinementCreate:
      type: object
      additionalProperties: false
      properties:
        expected_version: *id002
        base_revision_id: *id001
        instruction:
          type: string
          minLength: 1
          maxLength: 4000
        tone:
          type: string
          enum:
          - natural
          - formal
        length:
          type: string
          enum:
          - concise
          - standard
      required:
      - expected_version
      - base_revision_id
      - instruction
      description: AI refinement creates a candidate, never auto-applies. Tone/length only valid for cover_letter;
        handler rejects these for resumes.
    CandidateApply:
      type: object
      additionalProperties: false
      properties:
        expected_version: *id002
        revision_id: *id001
      required:
      - expected_version
      - revision_id
    ExportCreate:
      type: object
      additionalProperties: false
      properties:
        revision_id: *id001
        format:
          type: string
          enum:
          - pdf
          - docx
        template_version:
          type: string
          const: '1'
      required:
      - revision_id
      - format
      - template_version
    DocumentExport:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        document_id: *id001
        revision_id: *id001
        format:
          type: string
          enum:
          - pdf
          - docx
        template_version:
          type: string
          const: '1'
        task_id: *id001
        file_id:
          anyOf:
          - *id001
          - type: 'null'
        created_at: *id003
      required:
      - id
      - document_id
      - revision_id
      - format
      - template_version
      - task_id
      - file_id
      - created_at
    TrackWorkspace:
      type: object
      additionalProperties: false
      properties:
        expected_version: *id002
        resume_revision_id: *id001
        cover_letter_revision_id: *id001
      required:
      - expected_version
      description: Revision IDs here refer to generated document revisions, not base resumes. Select only
        owned revisions of this workspace. Existing association is returned; changing linked versions
        is a future explicit operation.
    WorkspaceTracked:
      type: object
      additionalProperties: false
      properties:
        application_id: *id001
        workspace_version: *id002
      required:
      - application_id
      - workspace_version
    AIConfig:
      type: object
      additionalProperties: false
      required:
      - version
      - mode
      - enabled
      - revision
      - provider_id
      - model_id
      - has_key
      - test_status
      - last_tested_at
      - error_code
      - daily_request_limit
      - platform_available
      properties:
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mode:
          type: string
          const: personal
        enabled:
          type: boolean
        revision:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        provider_id:
          oneOf:
          - type: string
            const: openai
          - type: 'null'
        model_id:
          oneOf:
          - type: string
            enum:
            - gpt-4.1-mini
            - gpt-4.1
          - type: 'null'
        has_key:
          type: boolean
        test_status:
          type: string
          enum:
          - untested
          - testing
          - succeeded
          - failed
          - inconclusive
        last_tested_at:
          type:
          - string
          - 'null'
          format: date-time
        error_code:
          enum:
          - provider_auth_failed
          - provider_model_unavailable
          - provider_rate_limited
          - provider_unavailable
          - provider_invalid_response
          - provider_timeout
          - credential_unavailable
          - test_interrupted
          - null
        daily_request_limit:
          type: integer
          minimum: 1
          maximum: 100
        platform_available:
          type: boolean
          const: false
    AIConfigPut:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - provider_id
      - model_id
      - daily_request_limit
      properties:
        expected_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        provider_id:
          type: string
          const: openai
        model_id:
          type: string
          enum:
          - gpt-4.1-mini
          - gpt-4.1
        api_key:
          type: string
          minLength: 8
          maxLength: 4096
          pattern: ^[\x21-\x7e]+$
          not:
            pattern: \*\*\*
          writeOnly: true
          description: Omit to retain the saved key. Null, empty and masked keys are invalid. Never returned.
        daily_request_limit:
          type: integer
          minimum: 1
          maximum: 100
    AIConfigPatch:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mode:
          type: string
          const: personal
        enabled:
          type: boolean
        daily_request_limit:
          type: integer
          minimum: 1
          maximum: 100
      anyOf:
      - required:
        - mode
      - required:
        - enabled
      - required:
        - daily_request_limit
    AIConfigTest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - revision
      properties:
        expected_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    AIProviders:
      type: object
      additionalProperties: false
      required:
      - providers
      - available
      - platform_available
      - generation_available
      - test_notice
      - test_limits
      - max_daily_request_limit
      properties:
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - name
            - models
            properties:
              id:
                type: string
                const: openai
              name:
                type: string
                const: OpenAI
              models:
                type: array
                items:
                  type: string
                  enum:
                  - gpt-4.1-mini
                  - gpt-4.1
        available:
          type: boolean
        platform_available:
          type: boolean
          const: false
        generation_available:
          type: boolean
          const: false
        test_notice:
          type: string
        test_limits:
          type: object
          additionalProperties: false
          required:
          - per_minute
          - per_day
          properties:
            per_minute:
              type: integer
              const: 3
            per_day:
              type: integer
              const: 20
        max_daily_request_limit:
          type: integer
          const: 100
  responses:
    BadRequest:
      description: Malformed JSON, unknown fields, invalid values or query/cursor.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/invalid/expired application session; login errors are generic invalid_credentials.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Origin or CSRF validation failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource missing or owned by another user; do not disclose which.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version conflict, normalized email already registered, or resource archived.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Body exceeds 128 KiB or JD exceeds 65536 UTF-8 bytes.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Expected application/json for operations with JSON bodies.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit reached; Retry-After is delay in seconds.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Database unavailable or service draining.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected failure; no SQL, credentials or stack traces in response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    X-Request-ID:
      description: Server-generated request correlation ID.
      schema:
        type: string
    Cache-Control:
      description: Private responses always use no-store.
      schema:
        type: string
        const: no-store
